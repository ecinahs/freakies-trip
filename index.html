<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDF1F5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<title>Freakies Trip Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
/* Layout: one narrow phone-first column — rate chip, three girl cards, settle-up, add form, ledger table */
:root{
  --bg:#FDF1F5; --card:#FFFFFF; --ink:#3A1E36; --muted:#8C6A85; --line:#F1D6E2;
  --accent:#E8467C; --accent-ink:#FFFFFF; --soft:#FCE4EE;
  --pels:#EC5C9A; --pels-bg:#FDE3EF;
  --hanting:#E99A1F; --hanting-bg:#FFF0D6;
  --shanice:#1FA89B; --shanice-bg:#DAF4F1;
  --good:#1E9B63; --good-bg:#DDF5E8; --owe:#D2445B; --owe-bg:#FDE2E6;
  --shadow:0 2px 0 #EBC9D8;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211420; --card:#2D1B2B; --ink:#FBEAF3; --muted:#C7A3BC; --line:#47293F;
  --accent:#FF6E9D; --accent-ink:#2A0E1C; --soft:#3A2136;
  --pels:#FF7FB3; --pels-bg:#4A2238; --hanting:#FFBC55; --hanting-bg:#47341A;
  --shanice:#4ED3C5; --shanice-bg:#173F3B;
  --good:#5CD69A; --good-bg:#183A2A; --owe:#FF7A8E; --owe-bg:#4A1E27; --shadow:0 2px 0 #170C16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211420; --card:#2D1B2B; --ink:#FBEAF3; --muted:#C7A3BC; --line:#47293F;
  --accent:#FF6E9D; --accent-ink:#2A0E1C; --soft:#3A2136;
  --pels:#FF7FB3; --pels-bg:#4A2238; --hanting:#FFBC55; --hanting-bg:#47341A;
  --shanice:#4ED3C5; --shanice-bg:#173F3B;
  --good:#5CD69A; --good-bg:#183A2A; --owe:#FF7A8E; --owe-bg:#4A1E27; --shadow:0 2px 0 #170C16; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:clamp(30px,8vw,44px);line-height:1.02;font-weight:700}
h1 .flower{color:var(--accent);display:inline-block;transform:translateY(-3px)}
h2{font-size:20px;font-weight:600}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.chip input#rate{width:72px;padding:3px 6px;font-size:14px;border:none;background:var(--soft);color:var(--ink);border-radius:8px;padding:3px 6px;font:inherit;text-align:right}
.seg{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font:700 13px var(--body);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sync{font-size:12px;color:var(--muted)}

.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
.total .big{font-family:var(--display);font-size:34px;font-weight:700}
.total .sub{color:var(--muted);font-weight:600}

.girls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.girls{grid-template-columns:1fr}}
.girl{border-radius:20px;padding:14px;background:var(--gbg);border:2px solid var(--gc);display:flex;flex-direction:column;gap:6px;min-width:0}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.kitties{display:flex;gap:2px}
.kit{width:64px;height:64px;max-width:100%}
.kit.k-hanting{transform:translateY(-6px) rotate(-4deg)}
.kit.k-shanice{transform:rotate(5deg)}
.k-pels{--fur:#FFFFFF;--belly:#FDE3EF;--ear:#F7A1BE;--bow:var(--pels)}
.k-hanting{--fur:#F6B868;--belly:#FFF0D6;--ear:#F7A1BE;--bow:var(--hanting)}
.k-shanice{--fur:#9A9AA8;--belly:#E9E9EF;--ear:#F7A1BE;--bow:var(--shanice)}
.k-pels{filter:drop-shadow(0 1px 0 #EBC9D8)}
.girl{position:relative;overflow:hidden}
.girl .kit{position:absolute;right:-6px;bottom:-8px;width:78px;height:78px;opacity:.95}
.girl .row,.girl .pill{position:relative;z-index:1}
.girl .row{margin-right:58px}
.empty-kit{width:72px;height:72px;display:block;margin:4px auto 0}
.girl .name{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink)}
.dot{width:26px;height:26px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font:700 13px var(--display);flex:none}
.girl .row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.girl .row span:first-child{color:var(--muted);font-weight:600}
.girl .row b{font-weight:800}
.pill{align-self:flex-start;border-radius:999px;padding:3px 10px;font-weight:800;font-size:12.5px}
.pill.get{background:var(--good-bg);color:var(--good)}
.pill.owe{background:var(--owe-bg);color:var(--owe)}
.pill.even{background:var(--card);color:var(--muted)}
.p-pels{--gc:var(--pels);--gbg:var(--pels-bg)} .p-hanting{--gc:var(--hanting);--gbg:var(--hanting-bg)} .p-shanice{--gc:var(--shanice);--gbg:var(--shanice-bg)}

.settle ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.settle li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:10px 12px;font-weight:700}
.settle li .amt{margin-left:auto;font-family:var(--display);font-size:18px}
.arrow{color:var(--muted)}
.empty{color:var(--muted);font-weight:600;margin:8px 0 0}

form{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.f2{grid-template-columns:1fr}}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date]{width:100%;font:600 16px var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.amtrow{display:flex;gap:8px}
.amtrow input{flex:1;min-width:0}
.pickers{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:2px solid var(--gc);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:700 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pick[aria-pressed="true"]{background:var(--gc);color:#fff}
.pick.cur{--gc:var(--accent)}
.btn{border:none;background:var(--accent);color:var(--accent-ink);font:600 17px var(--display);padding:12px 18px;border-radius:16px;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:none}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.err{color:var(--owe);font-weight:700;font-size:13px;margin:0}

.tablewrap{overflow-x:auto;margin:10px -4px 0}
table{width:100%;border-collapse:collapse;min-width:560px;font-size:14px}
th{font:600 13px var(--display);text-align:right;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th.c-pels{color:var(--pels)} th.c-hanting{color:var(--hanting)} th.c-shanice{color:var(--shanice)}
td{padding:9px 6px;border-bottom:1px dashed var(--line);text-align:right;vertical-align:top}
td .item{font-weight:700}
td .meta{font-size:12px;color:var(--muted)}
td .orig{display:block;font-size:11.5px;color:var(--muted)}
tfoot td{font-weight:800;border-bottom:none;border-top:2px solid var(--line);font-family:var(--display);font-size:15px}
.spendhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.resetbtn{border:2px solid var(--line);background:var(--card);color:var(--muted);font:700 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.resetbtn:hover{color:var(--owe);border-color:var(--owe)}
.resetbox{margin-top:10px;background:var(--owe-bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.resetbox p{margin:0;font-weight:700;color:var(--owe)}
.resetactions{display:flex;gap:8px;flex-wrap:wrap}
.resetyes{border:none;background:var(--owe);color:#fff;font:700 14px var(--body);padding:8px 14px;border-radius:12px;cursor:pointer}
.resetno{border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 14px var(--body);padding:6px 14px;border-radius:12px;cursor:pointer}
.cats{display:flex;flex-direction:column;gap:7px;margin-top:14px;width:100%}
.catrow{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:10px;font-size:13.5px;font-weight:700}
.catrow .bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.catrow .bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.catrow .v{color:var(--muted)}
.catchip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:800;color:var(--ink);margin-right:4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.filters button{border:2px solid var(--line);background:var(--card);color:var(--muted);font:700 13px var(--body);padding:4px 11px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.paidbtn{border:2px solid var(--owe);background:var(--owe-bg);color:var(--owe);font:800 12px var(--body);padding:4px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
.paidbtn.on{border-color:var(--good);background:var(--good-bg);color:var(--good)}
tr.isPaid td .item,tr.isPaid td .meta,tr.isPaid td.num{opacity:.55}
.paidbtn{margin:4px 0}
td:first-child{min-width:150px}
tr.isPaid .item{text-decoration:line-through;text-decoration-color:var(--muted)}
.settlenote{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.del{border:none;background:transparent;color:var(--muted);cursor:pointer;font:700 12px var(--body);padding:2px 4px;border-radius:6px}
.del:hover{color:var(--owe)}
.del.confirm{background:var(--owe-bg);color:var(--owe)}
.tabempty{padding:22px 6px;text-align:center;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:no-preference){.girl,.panel{transition:transform .15s} .pick{transition:background .12s}}
</style>
</head>
<body>

  <symbol id="kitten" viewBox="0 0 120 120">
    <path d="M88 98c16 2 24-10 20-22-2-6-8-6-8 0 0 8-6 13-14 12" fill="none" stroke="var(--fur)" stroke-width="9" stroke-linecap="round"/>

<div class="wrap">
  <header>
    <span class="eyebrow">First ever Freakies trip · Thailand</span>
    <div class="hero">
      <h1>Freakies Trip Tracker <span class="flower" aria-hidden="true">✿</span></h1>
      <div class="kitties" aria-hidden="true">
        <svg class="kit k-pels"><use href="#kitten"/></svg>

    </div>
    <div class="toprow">
      <label class="chip" for="rate">1 SGD = <input id="rate" class="num" type="number" step="0.01" min="1" inputmode="decimal"> THB</label>
      <div class="seg" role="group" aria-label="Show totals in">

  <section class="panel total">

      <div class="f2">

          <div class="amtrow">
            <input id="amount" class="num" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
            <div class="seg" role="group" aria-label="Currency">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

const GIRLS=[{id:"pels",name:"Pels"},{id:"hanting",name:"Hanting"},{id:"shanice",name:"Shanice"}];
const DEFAULT_RATE=26.16; // mid-market 1 SGD → THB, 16 Oct 2026
let state={rate:DEFAULT_RATE,expenses:[]};
let show="SGD", cur="THB", payer=null, split=new Set(GIRLS.map(g=>g.id));
let sb=null, pendingDel=null, cat="food", filter="all";
const CATS=[{id:"food",name:"Food",icon:"🍜"},{id:"transport",name:"Transport",icon:"🛺"},{id:"accoms",name:"Accoms",icon:"🏨"},{id:"shopping",name:"Shopping",icon:"🛍️"},{id:"activities",name:"Activities",icon:"🎡"},{id:"others",name:"Others",icon:"✨"}];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const SUPABASE_URL="https://fpqnjuuqayvfdrohxisu.supabase.co";
const SUPABASE_KEY="sb_publishable_NXdx9ZMv2xFuN-AmuO4cKg_BDa_GIuz";
const $=id=>document.getElementById(id);


const toSGD=e=>e.currency==="SGD"?e.amount:e.amount/state.rate;
const fmtS=v=>"S$"+v.toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtB=v=>"฿"+Math.round(v).toLocaleString("en-SG");
const fmt=sgd=>show==="SGD"?fmtS(sgd):fmtB(sgd*state.rate);
const fmtAlt=sgd=>show==="SGD"?fmtB(sgd*state.rate):fmtS(sgd);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function compute(){
  const paid={},share={};GIRLS.forEach(g=>{paid[g.id]=0;share[g.id]=0});
  const bal={};GIRLS.forEach(g=>bal[g.id]=0);
  const byCat={};CATS.forEach(c=>byCat[c.id]=0);
  let total=0,unpaidN=0;
  for(const e of state.expenses){
    const s=toSGD(e); total+=s; byCat[catOf(e.category).id]+=s;
    if(paid[e.payer]!==undefined) paid[e.payer]+=s;
    const who=(e.split&&e.split.length?e.split:GIRLS.map(g=>g.id)).filter(id=>share[id]!==undefined);
    who.forEach(id=>share[id]+=s/who.length);
    if(!e.paid){
      if(bal[e.payer]!==undefined) bal[e.payer]+=s;
      who.forEach(id=>bal[id]-=s/who.length);
      if(who.some(id=>id!==e.payer)) unpaidN++;
    }
  }
  return {paid,share,bal,total,byCat,unpaidN};
}
function settle(bal){
  const cred=[],debt=[];
  GIRLS.forEach(g=>{const b=Math.round(bal[g.id]*100)/100;if(b>0.004)cred.push({id:g.id,v:b});else if(b<-0.004)debt.push({id:g.id,v:-b});});
  cred.sort((a,b)=>b.v-a.v);debt.sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const x=Math.min(debt[i].v,cred[j].v);out.push({from:debt[i].id,to:cred[j].id,v:x});
    debt[i].v-=x;cred[j].v-=x;if(debt[i].v<0.005)i++;if(cred[j].v<0.005)j++;}
  return out;
}
const nameOf=id=>(GIRLS.find(g=>g.id===id)||{name:id}).name;

function render(){
  const {paid,share,bal,total,byCat,unpaidN}=compute();
  if(document.activeElement!==$("rate")) $("rate").value=state.rate;
  $("grand").textContent=fmt(total); $("grandAlt").textContent=fmtAlt(total)+(show==="SGD"?" in baht":" in SGD");
  const maxC=Math.max(...Object.values(byCat),0);
  $("cats").innerHTML=CATS.filter(c=>byCat[c.id]>0).map(c=>`<div class="catrow"><span>${c.icon} ${c.name}</span><span class="bar"><i style="width:${(byCat[c.id]/maxC*100).toFixed(1)}%"></i></span><span class="v num">${fmt(byCat[c.id])}</span></div>`).join("");
  $("girls").innerHTML=GIRLS.map(g=>{
    const b=bal[g.id];const pill=Math.abs(b)<0.005?'<span class="pill even">All square</span>':b>0?`<span class="pill get">Gets back ${fmt(b)}</span>`:`<span class="pill owe">Owes ${fmt(-b)}</span>`;
    return `<article class="girl p-${g.id}"><svg class="kit k-${g.id}" aria-hidden="true"><use href="#kitten"/></svg><div class="name"><span class="dot">${g.name[0]}</span>${g.name}</div>
      <div class="row"><span>Paid out</span><b class="num">${fmt(paid[g.id])}</b></div>
      <div class="row"><span>Her share</span><b class="num">${fmt(share[g.id])}</b></div>${pill}</article>`}).join("");
  const s=settle(bal);
  $("settle").innerHTML=s.length?s.map(t=>`<li><span>${nameOf(t.from)}</span><span class="arrow">pays</span><span>${nameOf(t.to)}</span><span class="amt num">${fmt(t.v)}</span></li>`).join("")
    :`<p class="empty">${state.expenses.length?"Everyone is square. Cute.":"Nothing to settle yet. Add the first spend below."}</p>`;
  $("settleNote").textContent=unpaidN?`Based on ${unpaidN} spend${unpaidN>1?"s":""} not paid back yet. Tap "Not paid" on a spend once it's settled.`:(state.expenses.length?"Every spend has been paid back.":"");
  $("filters").innerHTML=[{id:"all",name:"All",icon:""},...CATS.filter(c=>byCat[c.id]>0)].map(c=>`<button type="button" data-id="${c.id}" aria-pressed="${filter===c.id}">${c.icon?c.icon+" ":""}${c.name}</button>`).join("");
  if(filter!=="all"&&!(byCat[filter]>0))filter="all";
  const shown=filter==="all"?state.expenses:state.expenses.filter(e=>catOf(e.category).id===filter);
  const fpaid={};GIRLS.forEach(g=>fpaid[g.id]=0);let ftotal=0;shown.forEach(e=>{const v=toSGD(e);ftotal+=v;if(fpaid[e.payer]!==undefined)fpaid[e.payer]+=v;});
  const sorted=[...shown].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.at||0)-(a.at||0));
  $("rows").innerHTML=sorted.length?sorted.map(e=>{
    const s=toSGD(e);const orig=e.currency==="THB"?fmtB(e.amount):fmtS(e.amount);
    const splitTxt=(e.split&&e.split.length&&e.split.length<GIRLS.length)?" · split: "+e.split.map(nameOf).join(", "):"";
    const cells=GIRLS.map(g=>g.id===e.payer?`<td class="num"><b>${fmt(s)}</b>${(e.currency!==show)?`<span class="orig">${orig}</span>`:""}</td>`:`<td></td>`).join("");
    const c=catOf(e.category);
    return `<tr class="${e.paid?"isPaid":""}"><td><div class="item">${esc(e.what)}</div><button type="button" class="paidbtn${e.paid?" on":""}" data-paid="${e.id}" aria-pressed="${!!e.paid}">${e.paid?"Paid back ✓":"Not paid"}</button><div class="meta"><span class="catchip">${c.icon} ${c.name}</span>${e.date?new Date(e.date+"T00:00").toLocaleDateString("en-SG",{day:"numeric",month:"short"}):""}${splitTxt}</div></td>${cells}
      <td class="num">${fmt(s)}</td><td><button class="del${pendingDel===e.id?" confirm":""}" data-id="${e.id}" type="button">${pendingDel===e.id?"Sure?":"✕"}</button></td></tr>`}).join("")
    :`<tr><td colspan="6" class="tabempty"><svg class="empty-kit k-hanting" aria-hidden="true"><use href="#kitten"/></svg>No spends yet. The first mango smoothie goes here.</td></tr>`;
  $("foot").innerHTML=`<td>${filter==="all"?"Total":catOf(filter).name+" total"}</td>${GIRLS.map(g=>`<td class="num">${fmt(fpaid[g.id])}</td>`).join("")}<td class="num">${fmt(ftotal)}</td><td></td>`;
  $("showSGD").setAttribute("aria-pressed",show==="SGD");$("showTHB").setAttribute("aria-pressed",show==="THB");
  renderForm();
}
function renderForm(){
  $("payer").innerHTML=GIRLS.map(g=>`<button type="button" class="pick p-${g.id}" data-id="${g.id}" aria-pressed="${payer===g.id}">${g.name}</button>`).join("");
  $("split").innerHTML=GIRLS.map(g=>`<button type="button" class="pick p-${g.id}" data-id="${g.id}" aria-pressed="${split.has(g.id)}">${g.name}</button>`).join("");
  $("catPick").innerHTML=CATS.map(c=>`<button type="button" class="pick cur" data-id="${c.id}" aria-pressed="${cat===c.id}">${c.icon} ${c.name}</button>`).join("");
  $("curTHB").setAttribute("aria-pressed",cur==="THB");$("curSGD").setAttribute("aria-pressed",cur==="SGD");
  const a=parseFloat($("amount").value);
  if(a>0&&split.size){const sgd=cur==="SGD"?a:a/state.rate;
    $("preview").textContent=`= ${fmtS(sgd)} / ${fmtB(sgd*state.rate)} · ${fmtS(sgd/split.size)} each for ${split.size}`;}
  else $("preview").textContent="";
}

$("payer").onclick=e=>{const b=e.target.closest("button");if(!b)return;payer=b.dataset.id;renderForm();};
$("split").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id;split.has(id)?split.delete(id):split.add(id);renderForm();};
$("catPick").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.id;renderForm();};
$("filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.id;render();};
$("curTHB").onclick=()=>{cur="THB";renderForm()};$("curSGD").onclick=()=>{cur="SGD";renderForm()};
$("amount").oninput=renderForm;
$("showSGD").onclick=()=>{show="SGD";render()};$("showTHB").onclick=()=>{show="THB";render()};
let rateT;
$("rate").oninput=()=>{const r=parseFloat($("rate").value);if(!(r>0))return;state.rate=r;render();clearTimeout(rateT);
  rateT=setTimeout(async()=>{if(!sb)return;const {error}=await sb.from("settings").update({rate:r}).eq("id",1);if(error)setSync("Couldn't save the rate. Check your connection.");},700);};

$("form").onsubmit=async ev=>{
  ev.preventDefault();const err=$("err");
  const what=$("what").value.trim(),amount=parseFloat($("amount").value);
  const msg=!what?"Add what it was for.":!(amount>0)?"Enter an amount above 0.":!payer?"Tap who paid.":!split.size?"Pick at least one Freakie to split with.":"";
  if(msg){err.textContent=msg;err.hidden=false;return;}err.hidden=true;
  const e={id:"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),what,amount:Math.round(amount*100)/100,currency:cur,payer,
    split:GIRLS.map(g=>g.id).filter(id=>split.has(id)),category:cat,paid:false,date:$("date").value||today(),at:Date.now()};
  if(!sb){err.textContent="Not connected yet. Check your internet and reload.";err.hidden=false;return;}
  const {error}=await sb.from("expenses").insert(e);
  if(error){err.textContent="Couldn't save just now. Check your connection and try again.";err.hidden=false;return;}
  state.expenses.push(e);
  $("what").value="";$("amount").value="";split=new Set(GIRLS.map(g=>g.id));render();$("what").focus();
};
$("rows").onclick=async ev=>{
  const pb=ev.target.closest(".paidbtn");
  if(pb){const e=state.expenses.find(x=>x.id===pb.dataset.paid);if(!e||!sb)return;const next=!e.paid;e.paid=next;render();
    const {error}=await sb.from("expenses").update({paid:next}).eq("id",e.id);
    if(error){e.paid=!next;render();setSync("Couldn't update. Check your connection.");}
    return;}
  const b=ev.target.closest(".del");if(!b)return;const id=b.dataset.id;
  if(pendingDel!==id){pendingDel=id;render();setTimeout(()=>{if(pendingDel===id){pendingDel=null;render();}},4000);return;}
  pendingDel=null;
  if(!sb)return;
  const {error}=await sb.from("expenses").delete().eq("id",id);
  if(error){setSync("Couldn't delete. Try again.");return;}
  state.expenses=state.expenses.filter(e=>e.id!==id);render();
};
$("resetBtn").onclick=()=>{const n=state.expenses.length;$("resetMsg").textContent=n?`Delete all ${n} spend${n>1?"s":""} for everyone? This can't be undone.`:"There are no spends to clear yet.";$("resetYes").hidden=!n;$("resetBox").hidden=false;};
$("resetNo").onclick=()=>{$("resetBox").hidden=true;};
$("resetYes").onclick=async()=>{if(!sb)return;$("resetYes").disabled=true;
  const {error}=await sb.from("expenses").delete().neq("id","");$("resetYes").disabled=false;
  if(error){$("resetMsg").textContent="Couldn't reset. Check your connection and try again.";return;}
  state.expenses=[];$("resetBox").hidden=true;render();};
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

$("date").value=today();
render();

function setSync(t){$("sync").textContent=t;}
async function loadAll(){
  const [ex,st]=await Promise.all([sb.from("expenses").select("*"),sb.from("settings").select("rate").eq("id",1).maybeSingle()]);
  if(ex.error){setSync("Offline · can't load spends");return;}
  state.expenses=ex.data.map(r=>({...r,amount:Number(r.amount),at:Number(r.at)}));
  if(st.data&&Number(st.data.rate)>0&&document.activeElement!==$("rate"))state.rate=Number(st.data.rate);
  setSync("Shared with the Freakies · live");render();
}
(async()=>{
  try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){setSync("Couldn't connect. Reload to try again.");return;}
  await loadAll();
  let t;const refresh=()=>{clearTimeout(t);t=setTimeout(loadAll,250);};
  sb.channel("trip").on("postgres_changes",{event:"*",schema:"public",table:"expenses"},refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"settings"},refresh).subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadAll();});
})();
</script>
</body>
</html>
